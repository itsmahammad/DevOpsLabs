name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd apps/frontend
          npm install
          npm run build

      - name: Deploy with Ansible
        run: |
          cd /home/azureuser/config/ansible
          ansible-playbook playbooks/deploy-frontend.yml \
            -i inventories/dev/hosts.yml \
            --extra-vars "artifact_path=${GITHUB_WORKSPACE}/apps/frontend/dist"
